<script type="module">

import * as THREE from "three";

const $=s=>document.querySelector(s);

const SAVE_KEY="ECHO_1997_V06";

/* =========================================================
   ENGINE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x071015);
scene.fog=new THREE.FogExp2(0x071015,.008);

const camera=new THREE.PerspectiveCamera(
 72,
 innerWidth/innerHeight,
 .025,
 900
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.92;

document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();

/* =========================================================
   STATE
========================================================= */

const state={
 quest:"INTRO_MAYA",
 minutes:23*60+48,
 day:18,

 flashlight:false,
 battery:100,

 hasMap:false,
 timeline:0,

 train:false,

 flags:{}
};

const player={
 pos:new THREE.Vector3(-8,1.72,91),
 vy:0,
 grounded:true,
 radius:.33
};

let yaw=Math.PI;
let pitch=0;

let playing=false;
let dialogueActive=false;
let mapOpen=false;

const keys={};

let drag=false;
let lastMouseX=0;
let lastMouseY=0;

let mobileForward=0;
let mobileSide=0;

let walkPhase=0;

/* =========================================================
   MATERIALS
========================================================= */

function material(color,rough=.8,metal=.02){
 return new THREE.MeshStandardMaterial({
  color,
  roughness:rough,
  metalness:metal
 });
}

const M={
 grass:material(0x152018,1),
 road:material(0x11171a,.62,.12),
 pavement:material(0x555b58,.95),
 concrete:material(0x666862,.95),
 concreteDark:material(0x404542,.96),

 brick:material(0x594139,.94),
 brickDark:material(0x40302c,.96),

 plaster:material(0x74756d,.96),
 plasterDark:material(0x515651,.96),

 wood:material(0x513722,.87),
 darkWood:material(0x2b1d16,.92),

 metal:material(0x485053,.38,.68),
 darkMetal:material(0x171d1f,.5,.55),

 black:material(0x090b0c,.85),
 white:material(0xd0cec1,.86),

 red:material(0x71372f,.8),
 blue:material(0x334e62,.8),
 green:material(0x3e5947,.85),

 yellow:material(0xcaa23d,.75),

 skin:material(0xb98b6f,.85),
 jeans:material(0x25313a,.88),

 trainRed:material(0x642c29,.7,.15),
 trainCream:material(0xb2aa91,.82),

 seat:material(0x38544c,.88)
};

const GLASS=new THREE.MeshPhysicalMaterial({
 color:0x547b89,
 roughness:.12,
 metalness:.05,
 transparent:true,
 opacity:.38
});

/* =========================================================
   HELPERS
========================================================= */

const colliders=[];
const interactions=[];

function box(
 x,y,z,
 w,h,d,
 mat=M.white,
 collision=false,
 parent=scene
){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat
 );

 mesh.position.set(x,y,z);

 mesh.castShadow=true;
 mesh.receiveShadow=true;

 parent.add(mesh);

 if(collision){
  const c={
   x,z,w,d,
   enabled:true,
   parent,
   mesh
  };

  colliders.push(c);
  mesh.userData.collider=c;
 }

 return mesh;
}

function cylinder(
 x,y,z,
 radius,height,
 mat=M.white,
 parent=scene,
 segments=12
){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(
   radius,radius,height,segments
  ),
  mat
 );

 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;

 parent.add(mesh);

 return mesh;
}

function sphere(
 x,y,z,
 radius,
 mat=M.white,
 parent=scene
){
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(radius,16,12),
  mat
 );

 mesh.position.set(x,y,z);
 mesh.castShadow=true;

 parent.add(mesh);

 return mesh;
}

function plane(
 x,y,z,
 w,d,
 mat=M.white,
 parent=scene
){
 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(w,d),
  mat
 );

 mesh.rotation.x=-Math.PI/2;
 mesh.position.set(x,y,z);

 mesh.receiveShadow=true;

 parent.add(mesh);

 return mesh;
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));

function horizontalDistance(a,b){
 return Math.hypot(a.x-b.x,a.z-b.z);
}

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
 new THREE.HemisphereLight(
  0x8499aa,
  0x111811,
  .38
 )
);

const moonLight=new THREE.DirectionalLight(
 0xb6c8d8,
 1.1
);

moonLight.position.set(-90,120,50);

moonLight.castShadow=true;
moonLight.shadow.mapSize.set(2048,2048);

moonLight.shadow.camera.left=-220;
moonLight.shadow.camera.right=220;
moonLight.shadow.camera.top=220;
moonLight.shadow.camera.bottom=-220;

scene.add(moonLight);

const moon=sphere(
 -120,95,-280,
 4,
 new THREE.MeshBasicMaterial({
  color:0xe2e8eb
 })
);

/* stars */

const starGeo=new THREE.BufferGeometry();
const starPositions=[];

for(let i=0;i<450;i++){

 const x=(Math.random()-.5)*600;
 const y=50+Math.random()*160;
 const z=(Math.random()-.5)*600;

 starPositions.push(x,y,z);
}

starGeo.setAttribute(
 "position",
 new THREE.Float32BufferAttribute(
  starPositions,
  3
 )
);

scene.add(
 new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({
   color:0xd9e1e5,
   size:.45,
   transparent:true,
   opacity:.6
  })
 )
);

/* =========================================================
   EXACT MAP
========================================================= */

const LOC={
 BUS:new THREE.Vector3(-8,0,91),

 MAYA:new THREE.Vector3(-9,0,67),

 HOME_GATE:new THREE.Vector3(-18,0,50),
 HOME_DOOR:new THREE.Vector3(-18,0,48.4),
 HOME_VHS:new THREE.Vector3(-15,0,41),

 MILLERS:new THREE.Vector3(-20,0,-18),

 PHONE:new THREE.Vector3(8,0,-39),

 CINEMA:new THREE.Vector3(21,0,-57),

 MOTEL:new THREE.Vector3(-22,0,-75),

 POLICE:new THREE.Vector3(21,0,-91),

 SCHOOL:new THREE.Vector3(-25,0,-108),

 STATION:new THREE.Vector3(2,0,-138),

 PLATFORM:new THREE.Vector3(-8,0,-154),

 PLATFORM_END:new THREE.Vector3(-21,0,-154),

 TRACK:new THREE.Vector3(-6,0,-166),

 TUNNEL:new THREE.Vector3(-6,0,-220),

 TELECOM:new THREE.Vector3(29,0,-111)
};

/* =========================================================
   GROUND / ROAD
========================================================= */

plane(
 0,-.03,-70,
 520,520,
 M.grass
);

plane(
 0,.01,-55,
 14,330,
 M.road
);

plane(
 -9,.03,-55,
 4,330,
 M.pavement
);

plane(
 9,.03,-55,
 4,330,
 M.pavement
);

box(
 -6.9,.13,-55,
 .28,.26,330,
 M.concrete
);

box(
 6.9,.13,-55,
 .28,.26,330,
 M.concrete
);

for(let z=90;z>-205;z-=11){
 box(
  0,.04,z,
  .1,.02,4.2,
  M.white
 );
}

/* =========================================================
   WINDOWS
========================================================= */

function windowPanel(
 x,y,z,
 w=1.1,
 h=1.4,
 lit=false
){

 const mat=new THREE.MeshStandardMaterial({
  color:lit?0xb88c5c:0x243944,
  emissive:lit?0x7b4b23:0,
  emissiveIntensity:lit?.8:0,
  roughness:.25
 });

 const p=new THREE.Mesh(
  new THREE.PlaneGeometry(w,h),
  mat
 );

 p.position.set(x,y,z);
 scene.add(p);

 box(
  x,y-h/2-.08,z+.05,
  w+.18,.12,.15,
  M.concrete
 );
}

/* =========================================================
   BUILDING GENERATOR
========================================================= */

function createBuilding({
 x,z,w,d,floors=3,
 mat=M.brick,
 shop=false
}){

 const floorHeight=2.7;
 const h=floors*floorHeight+.5;

 box(
  x,h/2,z,
  w,h,d,
  mat,
  true
 );

 box(
  x,h+.14,z,
  w+.5,.28,d+.5,
  M.black
 );

 const cols=Math.max(
  2,
  Math.floor(w/2.6)
 );

 for(let f=0;f<floors;f++){

  for(let c=0;c<cols;c++){

   if(shop&&f===0)continue;

   const wx=
    x-w/2+
    (c+.5)*(w/cols);

   const wy=
    1.5+f*floorHeight;

   windowPanel(
    wx,
    wy,
    z+d/2+.01,
    1.05,
    1.35,
    Math.random()<.3
   );
  }
 }

 if(shop){

  for(let i=-1;i<=1;i++){

   const glass=
    new THREE.Mesh(
     new THREE.PlaneGeometry(
      1.7,
      1.8
     ),
     new THREE.MeshStandardMaterial({
      color:0x3f5d66,
      emissive:0x3b2916,
      emissiveIntensity:.35
     })
    );

   glass.position.set(
    x+i*2,
    1.35,
    z+d/2+.02
   );

   scene.add(glass);
  }

  box(
   x,2.65,z+d/2+.7,
   w*.75,.14,1.4,
   M.red
  );
 }
}

/* city */

createBuilding({
 x:-19,z:10,w:13,d:13,

});

createBuilding({

});

/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext=null;
let master=null;
let ambience=null;
let effects=null;

let lastStep=0;

function initAudio(){

 if(audioContext)return;

 audioContext=
  new(
   window.AudioContext||
   window.webkitAudioContext
  )();

 master=
  audioContext.createGain();

 ambience=
  audioContext.createGain();

 effects=
  audioContext.createGain();

 master.gain.value=.72;
 ambience.gain.value=.7;
 effects.gain.value=.95;

 ambience.connect(master);
 effects.connect(master);
 master.connect(audioContext.destination);

 createNoiseLoop(
  .07,
  900,
  7000
 );

 createNoiseLoop(
  .025,
  60,
  450
 );

 const hum=
  audioContext.createOscillator();

 const hg=
  audioContext.createGain();

 hum.frequency.value=60;
 hg.gain.value=.005;

 hum.connect(hg);
 hg.connect(ambience);

 hum.start();
}

function noiseBuffer(seconds){

 const buffer=
  audioContext.createBuffer(
   1,
   audioContext.sampleRate*seconds,
   audioContext.sampleRate
  );

 const data=
  buffer.getChannelData(0);

 for(let i=0;i<data.length;i++){
  data[i]=Math.random()*2-1;
 }

 return buffer;
}

function createNoiseLoop(
 volume,
 minFreq,
 maxFreq
){

 const src=
  audioContext.createBufferSource();

 src.buffer=
  noiseBuffer(4);

 src.loop=true;

 const hp=
  audioContext.createBiquadFilter();

 hp.type="highpass";
 hp.frequency.value=minFreq;

 const lp=
  audioContext.createBiquadFilter();

 lp.type="lowpass";
 lp.frequency.value=maxFreq;

 const gain=
  audioContext.createGain();

 gain.gain.value=volume;

 src.connect(hp);
 hp.connect(lp);
 lp.connect(gain);
 gain.connect(ambience);

 src.start();
}

function clickSound(){

 if(!audioContext)return;

 const o=
  audioContext.createOscillator();

 const g=
  audioContext.createGain();

 const now=
  audioContext.currentTime;

 o.frequency.value=900;

 g.gain.setValueAtTime(
  .04,now
 );

 g.gain.exponentialRampToValueAtTime(
  .0001,
  now+.035
 );

 o.connect(g);
 g.connect(effects);

 o.start();
 o.stop(now+.04);
}

function stepSound(run=false){

 if(!audioContext)return;

 const now=
  audioContext.currentTime;

 if(
  now-lastStep<
  (run?.22:.34)
 )return;

 lastStep=now;

 const src=
  audioContext.createBufferSource();

 src.buffer=
  noiseBuffer(.08);

 const lp=
  audioContext.createBiquadFilter();

 lp.type="lowpass";
 lp.frequency.value=
  400+Math.random()*160;

 const gain=
  audioContext.createGain();

 gain.gain.setValueAtTime(
  run?.15:.1,
  now
 );

 gain.gain.exponentialRampToValueAtTime(
  .0001,
  now+.09
 );

 src.connect(lp);
 lp.connect(gain);
 gain.connect(effects);

 src.start();
}

function staticSound(seconds=.5){

 if(!audioContext)return;

 const src=
  audioContext.createBufferSource();

 src.buffer=
  noiseBuffer(seconds);

 const bp=
  audioContext.createBiquadFilter();

 bp.type="bandpass";
 bp.frequency.value=3000;

 const gain=
  audioContext.createGain();

 gain.gain.setValueAtTime(
  .14,
  audioContext.currentTime
 );

 gain.gain.exponentialRampToValueAtTime(
  .0001,
  audioContext.currentTime+seconds
 );

 src.connect(bp);
 bp.connect(gain);
 gain.connect(effects);

 src.start();
}

function rumble(seconds=7){

 if(!audioContext)return;

 const src=
  audioContext.createBufferSource();

 src.buffer=
  noiseBuffer(seconds);

 const lp=
  audioContext.createBiquadFilter();

 lp.type="lowpass";
 lp.frequency.value=150;

 const gain=
  audioContext.createGain();

 const now=
  audioContext.currentTime;

 gain.gain.setValueAtTime(
  .0001,
  now
 );

 gain.gain.linearRampToValueAtTime(
  .3,
  now+1.8
 );

 gain.gain.setValueAtTime(
  .3,
  now+seconds-1.5
 );

 gain.gain.exponentialRampToValueAtTime(
  .0001,
  now+seconds
 );

 src.connect(lp);
 lp.connect(gain);
 gain.connect(effects);

 src.start();
}

  name,
  pos:pos.clone()

  "block";

  "none";

function updateWaypoint(dt){

 if(!waypoint)return;

 wpDiamond.rotation.y+=
  dt*2;

 wpDiamond.position.y=
  2.1+
  Math.sin(
   performance.now()*.003
  )*.18;

 const distance=
  horizontalDistance(
   player.pos,
   waypoint.pos
  );

 $("#wpName").textContent=
  waypoint.name;

 $("#wpDistance").textContent=
  Math.round(distance)+" m";

 const p=
  waypoint.pos.clone();

 p.y+=2.4;

 p.project(camera);

 let x=
  (p.x*.5+.5)*innerWidth;

 let y=
  (-p.y*.5+.5)*innerHeight;

 x=Math.max(
  60,
  Math.min(
   innerWidth-60,
   x
  )
 );

 y=Math.max(
  60,
  Math.min(
   innerHeight-60,
   y
  )
 );

 $("#waypoint").style.left=
  x+"px";

 $("#waypoint").style.top=
  y+"px";
}

/* =========================================================
   INTERACTION SYSTEM
========================================================= */

function addInteraction(
 object,
 range,
 text,
 action,
 condition=()=>true
){

 interactions.push({
  object,
  range,
  text,
  action,
  condition
 });
}

function objectPosition(object){

 const p=
  new THREE.Vector3();

 object.getWorldPosition(p);

 return p;
}

function nearestInteraction(){

 let best=null;
 let bestDistance=999;

 const forward=
  new THREE.Vector3(
   -Math.sin(yaw),
   0,
   -Math.cos(yaw)
  );

 for(const item of interactions){

  if(
   !item.object||
   !item.object.visible||
   !item.condition()
  )continue;

  const p=
   objectPosition(item.object);

  const d=
   horizontalDistance(
    player.pos,p
   );

  if(d>item.range)continue;

  const dir=
   new THREE.Vector3(
    p.x-player.pos.x,
    0,
    p.z-player.pos.z
   ).normalize();

  if(
   dir.dot(forward)<-.2
  )continue;

  if(d<bestDistance){

   bestDistance=d;
   best=item;
  }
 }

 return best;
}

function interact(){

 initAudio();

 if(dialogueActive){

  nextDialogue();
  return;
 }

 if(mapOpen){

  toggleMap();
  return;
 }

 const item=
  nearestInteraction();

 if(item)
  item.action();
}

function updateInteraction(){

 if(
  dialogueActive||
  mapOpen
 ){

  $("#interaction").style.opacity=0;
  return;
 }

 const item=
  nearestInteraction();

 if(item){

  $("#interaction").textContent=
   item.text;

  $("#interaction").style.opacity=1;

 }else{

  $("#interaction").style.opacity=0;
 }
}

/* =========================================================
   COLLISIONS
========================================================= */

function canMove(x,z){

 /*
   City collider system.
   Home doorway is genuinely empty after door collider disables.
 */

 for(const c of colliders){

  if(!c.enabled)
   continue;

  /*
   Collider coordinates are world coordinates.
   Generated moving train isn't added to this array,
   avoiding the old offset mismatch.
  */

  if(
   x>
    c.x-c.w/2-player.radius&&
   x<
    c.x+c.w/2+player.radius&&
   z>
    c.z-c.d/2-player.radius&&
   z<
    c.z+c.d/2+player.radius
  ){

   return false;
  }
 }

 return true;
}

/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(dt){

 if(
  !playing||
  dialogueActive||
  mapOpen
 )return;

 let forward=0;
 let side=0;

 if(keys.KeyW)forward+=1;
 if(keys.KeyS)forward-=1;

 if(keys.KeyD)side+=1;
 if(keys.KeyA)side-=1;

 forward+=mobileForward;
 side+=mobileSide;

 const length=
  Math.hypot(
   forward,
   side
  );

 if(length>1){

  forward/=length;
  side/=length;
 }

 const moving=
  Math.abs(forward)>.05||
  Math.abs(side)>.05;

 const run=
  keys.ShiftLeft&&
  forward>.2;

 const speed=
  run?6.7:4.05;

 const sin=
  Math.sin(yaw);

 const cos=
  Math.cos(yaw);

 const dx=
  (
   -sin*forward+
   cos*side
  )*speed*dt;

 const dz=
  (
   -cos*forward-
   sin*side
  )*speed*dt;

 if(
  canMove(
   player.pos.x+dx,
   player.pos.z
  )
 ){

  player.pos.x+=dx;
 }

 if(
  canMove(
   player.pos.x,
   player.pos.z+dz
  )
 ){

  player.pos.z+=dz;
 }

 player.vy-=12*dt;

 player.pos.y+=
  player.vy*dt;

 if(player.pos.y<=1.72){

  player.pos.y=1.72;
  player.vy=0;
  player.grounded=true;
 }

 if(
  moving&&
  player.grounded
 ){

  walkPhase+=
   dt*(run?12:8);

  const s=
   Math.sin(walkPhase);

  armL.rotation.x=
   -.38+s*.17;

  armR.rotation.x=
   -.38-s*.17;

  legL.rotation.x=
   s*.2;

  legR.rotation.x=
   -s*.2;

  flashlightModel.rotation.x=
   s*.025;

  stepSound(run);
 }

 camera.position.copy(
  player.pos
 );

 camera.rotation.order=
  "YXZ";

 camera.rotation.y=
  yaw;

 camera.rotation.x=
  pitch;

 if(
  state.flashlight&&
  state.battery>0
 ){

  state.battery-=
   dt*.09;

  if(state.battery<=0){

   state.battery=0;
   state.flashlight=false;

   refreshFlashlight();
  }
 }

 $("#batteryFill").style.width=
  state.battery+"%";
}

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

function setupMoveJoystick(){

 const base=
  $("#moveJoy");

 const stick=
  $("#moveStick");

 let active=false;
 let touchId=null;

 function updateTouch(touch){

  const rect=
   base.getBoundingClientRect();

  const cx=
   rect.left+
   rect.width/2;

  const cy=
   rect.top+
   rect.height/2;

  let dx=
   touch.clientX-cx;

  let dy=
   touch.clientY-cy;

  const max=
   rect.width*.34;

  const len=
   Math.hypot(dx,dy);

  if(len>max){

   dx=
    dx/len*max;

   dy=
    dy/len*max;
  }

  stick.style.transform=
   `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

  mobileSide=
   dx/max;

  mobileForward=
   -dy/max;
 }

 base.addEventListener(
  "touchstart",
  e=>{

   initAudio();

   const t=
    e.changedTouches[0];

   touchId=t.identifier;
   active=true;

   updateTouch(t);

   e.preventDefault();
  },
  {passive:false}
 );

 base.addEventListener(
  "touchmove",
  e=>{

   if(!active)return;

   for(const t of e.changedTouches){

    if(t.identifier===touchId)
     updateTouch(t);
   }

   e.preventDefault();
  },
  {passive:false}
 );

 function end(e){

  for(const t of e.changedTouches){

   if(t.identifier===touchId){

    active=false;
    touchId=null;

    mobileSide=0;
    mobileForward=0;

    stick.style.transform=
     "translate(-50%,-50%)";
   }
  }
 }

 base.addEventListener(
  "touchend",
  end
 );

 base.addEventListener(
  "touchcancel",
  end
 );
}

setupMoveJoystick();

/* =========================================================
   MOBILE LOOK — drag anywhere on right half
========================================================= */

let lookTouchId=null;
let lookX=0;
let lookY=0;

renderer.domElement.addEventListener(
 "touchstart",
 e=>{

  initAudio();

  for(const t of e.changedTouches){

   if(
    t.clientX>
    innerWidth*.42&&
    lookTouchId===null
   ){

    lookTouchId=
     t.identifier;

    lookX=t.clientX;
    lookY=t.clientY;
   }
  }
 },
 {passive:false}
);

renderer.domElement.addEventListener(
 "touchmove",
 e=>{

  if(
   lookTouchId===null||
   !playing||
   mapOpen
  )return;

  for(const t of e.changedTouches){

   if(
    t.identifier===
    lookTouchId
   ){

    const dx=
     t.clientX-lookX;

    const dy=
     t.clientY-lookY;

    lookX=t.clientX;
    lookY=t.clientY;

    yaw-=dx*.006;

    pitch-=dy*.005;

    pitch=
     THREE.MathUtils.clamp(
      pitch,
      -1.4,
      1.4
     );
   }
  }

  e.preventDefault();
 },
 {passive:false}
);

function endLook(e){

 for(const t of e.changedTouches){

  if(
   t.identifier===
   lookTouchId
  ){

   lookTouchId=null;
  }
 }
}

renderer.domElement.addEventListener(
 "touchend",
 endLook
);

renderer.domElement.addEventListener(
 "touchcancel",
 endLook
);

/* =========================================================
   TIME
========================================================= */

let timeCounter=0;

function updateTime(dt){

 if(!playing)return;

 timeCounter+=dt;

 /*
   1 game minute every 10 real seconds.
 */

 if(timeCounter>=10){

  timeCounter=0;

  state.minutes++;

  if(state.minutes>=1440){

   state.minutes=0;
   state.day++;
  }
 }

 const h=
  Math.floor(
   state.minutes/60
  );

 const m=
  state.minutes%60;

 $("#timeUI").textContent=
  String(h).padStart(2,"0")+
  ":"+
  String(m).padStart(2,"0");

 $("#dateUI").textContent=
  state.day+
  ".10.1997";
}

/* =========================================================
   SAVE
========================================================= */

function saveGame(){

 try{

  localStorage.setItem(
   SAVE_KEY,
   JSON.stringify({
    state,
    position:{
     x:player.pos.x,
     y:player.pos.y,
     z:player.pos.z
    },
    yaw,
    pitch
   })
  );

 }catch(e){

  console.warn(
   "SAVE ERROR",
   e
  );
 }
}

function restoreVisualState(){

 tape1.visible=
  !state.flags.tape1Taken;

 physicalMap.visible=
  !state.hasMap;

 if(state.timeline>=1){

  train.visible=false;
 }

 refreshFlashlight();
}

function loadGame(){

 try{

  const raw=
   localStorage.getItem(
    SAVE_KEY
   );

  if(!raw)return false;

  const data=
   JSON.parse(raw);

  Object.assign(
   state,
   data.state
  );

  if(data.position){

   player.pos.set(
    data.position.x,
    data.position.y,
    data.position.z
   );
  }

  yaw=data.yaw??Math.PI;
  pitch=data.pitch??0;

  restoreVisualState();

  return true;

 }catch(e){

  console.error(e);

  return false;
 }
}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

 requestAnimationFrame(loop);

 const dt=
  Math.min(
   clock.getDelta(),
   .04
  );

 updatePlayer(dt);

 updateInteraction();

 updateWaypoint(dt);

 updateTime(dt);

 updateStory();

 renderer.render(
  scene,
  camera
 );
}

camera.position.copy(
 player.pos
);

loop();
loading();
